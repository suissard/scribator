name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les tests d'intégration lancent un vrai PocketBase (version épinglée, checksum vérifié).
      - run: npm run pb:fetch
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
